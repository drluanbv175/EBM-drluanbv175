name: kiem-tinh-da-nen

# 16/08/2026 — repo GỐC trước nay KHÔNG có CI, trong khi chính nó sinh ra họ lỗi
# «viết cho một máy, gãy im lặng trên máy kia» (kiem_do_tuoi/os.getuid chết im
# trên Windows từ lúc ra đời · 7 script vietnamize/cp1252 · đường dẫn cứng).
# Hai lane ubuntu + windows chạy trên PHẦN ĐƯỢC TRACK (tools/ + ops/ + .claude/)
# — hẹp hơn máy thật (EBM-Dashboards/EBM_MASTER là data ngoài git), nói rõ để
# xanh ở đây không bị đọc thành «toàn kho sạch». Cần bác sĩ kiểm chứng.

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tinh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 = SÀN KHAI BÁO trong CLAUDE.md; 3.12 = bản CI cũ + máy Windows thật.
        # Trước 22/08/2026 CI chỉ chạy 3.12 nên 6 chỗ cú pháp PEP 701 (chỉ hợp lệ từ
        # 3.12) nằm im trong 5 file — trong đó có `kiem_do_tuoi_chung_cu.py`, MỘT
        # TRONG 7 CHỐT TỰ CHẠY MỖI PHIÊN. Trên môi trường 3.11 nó chết SyntaxError,
        # mà hook SessionStart kết thúc bằng `; true` nên nuốt lỗi không một dòng báo
        # — đúng lại họ lỗi mà chính file đó đã dính hồi 12/08 trên Windows.
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile toàn bộ tools/ + ops/ (bắt lỗi cú pháp đa nền)
        run: python -m compileall -q tools ops

      - name: Chốt đa nền R1–R6 (fail khi có 🔴; 🟡 là tồn kho soi dần)
        run: |
          set +e
          python tools/kiem_tuong_thich_da_nen.py
          rc=$?
          set -e
          if [ "$rc" -ge 2 ]; then
            echo "Có vi phạm 🔴 — xem log trên." >&2
            exit "$rc"
          fi

      - name: Smoke bảng tự-đề-xuất (phải chạy trọn dù thiếu mọi dữ liệu ngoài git)
        run: python tools/tu_de_xuat_viec.py --gon
