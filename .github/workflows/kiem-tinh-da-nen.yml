name: kiem-tinh-da-nen

# 16/08/2026 — repo GỐC trước nay KHÔNG có CI, trong khi chính nó sinh ra họ lỗi
# «viết cho một máy, gãy im lặng trên máy kia» (kiem_do_tuoi/os.getuid chết im
# trên Windows từ lúc ra đời · 7 script vietnamize/cp1252 · đường dẫn cứng).
# Hai lane ubuntu + windows chạy trên PHẦN ĐƯỢC TRACK (tools/ + ops/ + .claude/)
# — hẹp hơn máy thật (EBM-Dashboards/EBM_MASTER là data ngoài git), nói rõ để
# xanh ở đây không bị đọc thành «toàn kho sạch». Cần bác sĩ kiểm chứng.

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

# GỌN CI (02/10/2026, đo 70 lượt gần nhất): (1) mỗi push chồng lên push cũ của CÙNG nhánh — có nhánh 50 lượt trong 10 ngày, mỗi lượt 4 job —
# nên nhánh nào cũng chỉ cần kết quả commit MỚI NHẤT (huỷ lượt cũ; KHÔNG bao giờ huỷ lượt trên master). (2) Ma trận 2 hệ × 2 bản Python:
# 3.11 và 3.12 luôn cùng đỏ/cùng xanh (0/70 lượt lệch) nên bỏ cặp thừa, đổi lấy bản Python của MÁY THẬT còn chưa được CI phủ (Mac = 3.14).
concurrency:
  group: kiem-tinh-da-nen-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  kiem-tinh:
    timeout-minutes: 15     # đo: lượt bình thường 0,5–1,5 phút; trần để job treo không ăn hàng giờ
    strategy:
      fail-fast: false
      matrix:
        # BA lane, mỗi lane đại diện MỘT môi trường thật của bác sĩ:
        #   ubuntu  + 3.11 = SÀN KHAI BÁO trong CLAUDE.md. Trước 22/08/2026 CI chỉ chạy 3.12 nên 6 chỗ cú pháp PEP 701 (chỉ hợp lệ từ
        #                    3.12) nằm im trong 5 file — trong đó có `kiem_do_tuoi_chung_cu.py`, MỘT TRONG CÁC CHỐT TỰ CHẠY MỖI PHIÊN. Trên
        #                    3.11 nó chết SyntaxError, mà hook SessionStart kết thúc bằng `; true` nên nuốt lỗi không một dòng báo.
        #   windows + 3.12 = máy Windows thật (Python 3.12.10). Lane bắt họ lỗi «viết cho một máy, gãy trên máy kia» (os.getuid, đường dẫn cứng,
        #                    CRLF): trong 70 lượt đo có 1 lượt đỏ CHỈ ở Windows; PR #87 ngày 02/10 cũng đỏ chỉ ở Windows.
        #   ubuntu + 3.14  = máy Mac thật (Python 3.14.6) — trước đây KHÔNG lane nào phủ.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile toàn bộ tools/ + ops/ (bắt lỗi cú pháp đa nền)
        run: python -m compileall -q tools ops

      - name: Chốt đa nền R1–R6 (fail khi có 🔴; 🟡 là tồn kho soi dần)
        run: |
          set +e
          python tools/kiem_tuong_thich_da_nen.py
          rc=$?
          set -e
          if [ "$rc" -ge 2 ]; then
            echo "Có vi phạm 🔴 — xem log trên." >&2
            exit "$rc"
          fi

      - name: Smoke bảng tự-đề-xuất (phải chạy trọn dù thiếu mọi dữ liệu ngoài git)
        run: python tools/tu_de_xuat_viec.py --gon

      # 28/08/2026 — bộ test tools/ chạy được trên bản sao trần nhờ tools/conftest.py:
      # 23 test cần cây OneDrive được skip CÓ KHAI BÁO (pytest -rs đọc được lý do),
      # 0 test đang pass bị che (đo: 258 pass giữ nguyên trước/sau). Lượt đầu bật riêng
      # ubuntu; cùng ngày mở sang windows sau khi rà: không test nào dùng symlink/chmod,
      # PYTHONUTF8 đã ép, conftest ĐO thuộc tính filesystem thật (không đoán theo os)
      # nên test dedup .Codex≡.codex tự chạy đúng trên NTFS. Đây chính là phép đo
      # windows mà ghi chú cũ đòi — đo bằng chính CI, có người canh kết quả.
      # Sinh mirror Codex TRƯỚC khi test: test_agent_sync_health_is_green kiểm «mirror
      # khớp nguồn» — trên checkout tươi mirror chưa tồn tại (nó là bản tự sinh, cố ý
      # không track). Sinh ở đây cũng biến chính đường sync thành thứ được CI kiểm thật.
      - name: Bộ test tools/ (bản sao trần, skip có khai báo)
        run: |
          pip install pytest
          python tools/sync_agents_to_codex.py
          python -m pytest tools/ -q -rs

  # MỘT tên kiểm tra ổn định cho «bảo vệ nhánh»: bật required check chỉ cần khai `ci-ok`, đổi ma trận không phải sửa lại cài đặt.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [kiem-tinh]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mọi lane kiem-tinh phải xanh (huỷ/bỏ qua cũng là ĐỎ)
        env:
          KET_QUA: ${{ needs.kiem-tinh.result }}
        run: |
          [ "$KET_QUA" = "success" ] || { echo "kiem-tinh: $KET_QUA" >&2; exit 1; }
          echo "✅ mọi lane kiem-tinh xanh"
